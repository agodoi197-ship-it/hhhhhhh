<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alerta Escola Pro | Completo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --gov-blue: #002350; --gov-accent: #ffc107; --prof-purple: #6366f1;
            --bg-body: #f3f4f6; --white: #ffffff; --text-main: #1f2937; --text-sub: #6b7280;
            --success: #10b981; --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Telas */
        .screen { display: none; height: 100vh; padding: 20px 20px 100px; overflow-y: auto; flex-direction: column; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Elements */
        .glass-card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; margin-bottom: 15px; }
        .header-section { text-align: center; padding: 20px 0; }
        .header-section i { font-size: 40px; color: var(--gov-accent); margin-bottom: 10px; }
        
        .input-wrapper { margin-bottom: 12px; position: relative; }
        .input-wrapper label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; display: block; }
        .input-wrapper input, .input-wrapper textarea, .input-wrapper select { 
            width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid #d1d5db; outline: none; background: #f9fafb; font-size: 14px;
        }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--gov-blue); color: white; }
        .btn-purple { background: var(--prof-purple); color: white; }
        .btn-ghost { background: transparent; color: var(--text-sub); border: 1px solid #d1d5db; margin-top: 10px; }

        /* Tarefas */
        .task-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 12px; border: 1px solid #e5e7eb; border-left: 6px solid #d1d5db; }
        .task-card.done { border-left-color: var(--success); opacity: 0.7; }
        .task-date { font-size: 12px; color: var(--danger); font-weight: 600; margin-bottom: 8px; }

        /* Navbar */
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; display: none; justify-content: space-around; padding: 10px 0 25px; z-index: 100; }
        .nav-item { color: #9ca3af; text-align: center; font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--gov-blue); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <section id="scr-login" class="screen active">
            <div class="header-section"><i class="fas fa-graduation-cap"></i><h2>Alerta Escola MT</h2></div>
            <div class="glass-card">
                <div class="input-wrapper"><input type="email" id="l-email" placeholder="E-mail Institucional"></div>
                <div class="input-wrapper"><input type="password" id="l-pass" placeholder="Senha"></div>
                <button class="btn btn-primary" onclick="app.login('aluno')">ENTRAR COMO ALUNO</button>
                <button class="btn btn-purple" style="margin-top:10px" onclick="app.login('prof')">ENTRAR COMO PROFESSOR</button>
                <button class="btn btn-ghost" onclick="app.nav('scr-reg')">Criar Nova Conta</button>
            </div>
        </section>

        <section id="scr-reg" class="screen">
            <div class="header-section"><h2>Cadastro Pro</h2></div>
            <div class="glass-card">
                <div class="input-wrapper"><input type="text" id="r-name" placeholder="Nome Completo"></div>
                <div class="input-wrapper"><input type="email" id="r-email" placeholder="E-mail (@edu ou @professor)"></div>
                <div class="input-wrapper"><input type="password" id="r-pass" placeholder="Crie uma Senha"></div>
                
                <div id="box-prof-key" style="display:none" class="input-wrapper">
                    <label>Chave Mestre Docente</label>
                    <input type="password" id="r-key" placeholder="Código de Segurança">
                </div>

                <button class="btn btn-primary" id="btn-finish-reg" onclick="app.register()">FINALIZAR CADASTRO</button>
                <button class="btn btn-ghost" id="btn-toggle-reg" onclick="app.toggleRegMode()">SOU PROFESSOR(A)</button>
                <button class="btn btn-ghost" style="border:none" onclick="app.nav('scr-login')">Voltar ao Login</button>
            </div>
        </section>

        <section id="scr-dash" class="screen">
            <h3 id="welcome-msg">Bem-vindo!</h3>
            <div class="glass-card" style="margin-top:20px">
                <h4>Avisos Escolares</h4>
                <p style="font-size:14px; color:gray; margin-top:10px">Nenhum aviso importante no momento.</p>
            </div>
        </section>

        <section id="scr-tasks" class="screen">
            <div id="prof-area" style="display:none">
                <h3>Criar Tarefa 📋</h3>
                <div class="glass-card">
                    <div class="input-wrapper"><input type="text" id="t-title" placeholder="Título da Atividade"></div>
                    <div class="input-wrapper"><input type="date" id="t-date"></div>
                    <div class="input-wrapper">
                        <select id="t-target">
                            <option value="Todos">Todas as Turmas</option>
                            <option value="9º Ano A">9º Ano A</option>
                            <option value="1º Ano EM">1º Ano Ensino Médio</option>
                        </select>
                    </div>
                    <textarea id="t-desc" placeholder="Descrição da tarefa..." style="width:100%; border-radius:10px; padding:10px; border:1px solid #ddd; margin-bottom:10px"></textarea>
                    <button class="btn btn-purple" onclick="app.createTask()">PUBLICAR PARA ALUNOS</button>
                </div>
            </div>

            <div id="student-area" style="display:none">
                <h3>Minha Agenda 📖</h3>
                <p style="color:gray; margin-bottom:15px">Tarefas pendentes e prazos</p>
            </div>

            <div id="task-list"></div>
        </section>
    </div>

    <nav class="navbar" id="main-nav">
        <div class="nav-item active" onclick="app.nav('scr-dash', this)"><i class="fas fa-home"></i>Início</div>
        <div class="nav-item" onclick="app.nav('scr-tasks', this)"><i class="fas fa-tasks"></i>Tarefas</div>
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i>Sair</div>
    </nav>

    <script>
        const app = {
            user: null,
            isProfMode: false,
            storage: {
                users: JSON.parse(localStorage.getItem('app_users')) || [],
                tasks: JSON.parse(localStorage.getItem('app_tasks')) || []
            },

            nav: (id, el) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(el) {
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                }
                const isAuth = id === 'scr-login' || id === 'scr-reg';
                document.getElementById('main-nav').style.display = isAuth ? 'none' : 'flex';
                if(id === 'scr-tasks') app.renderTasks();
            },

            toggleRegMode: () => {
                app.isProfMode = !app.isProfMode;
                document.getElementById('box-prof-key').style.display = app.isProfMode ? 'block' : 'none';
                document.getElementById('btn-toggle-reg').innerText = app.isProfMode ? "SOU ALUNO" : "SOU PROFESSOR(A)";
            },

            register: () => {
                const name = document.getElementById('r-name').value;
                const email = document.getElementById('r-email').value;
                const pass = document.getElementById('r-pass').value;
                const key = document.getElementById('r-key').value;

                if(!name || !email || !pass) return alert("Preencha todos os campos!");
                
                if(app.isProfMode) {
                    if(!email.endsWith('@professor.mt.gov.br')) return alert("Use e-mail @professor");
                    if(key !== "MT2026") return alert("Chave mestre incorreta!");
                } else {
                    if(!email.endsWith('@edu.mt.gov.br')) return alert("Use e-mail @edu");
                }

                app.storage.users.push({ name, email, pass, role: app.isProfMode ? 'prof' : 'aluno' });
                localStorage.setItem('app_users', JSON.stringify(app.storage.users));
                alert("Conta criada! Faça login.");
                app.nav('scr-login');
            },

            login: (role) => {
                const email = document.getElementById('l-email').value;
                const pass = document.getElementById('l-pass').value;
                const found = app.storage.users.find(u => u.email === email && u.pass === pass && u.role === role);

                if(found) {
                    app.user = found;
                    document.getElementById('welcome-msg').innerText = `Olá, ${found.name.split(' ')[0]} 👋`;
                    document.getElementById('prof-area').style.display = role === 'prof' ? 'block' : 'none';
                    document.getElementById('student-area').style.display = role === 'aluno' ? 'block' : 'none';
                    app.nav('scr-dash');
                } else {
                    alert("Usuário não encontrado ou senha incorreta!");
                }
            },

            createTask: () => {
                const title = document.getElementById('t-title').value;
                const date = document.getElementById('t-date').value;
                const desc = document.getElementById('t-desc').value;
                if(!title || !date) return alert("Preencha título e data!");

                app.storage.tasks.push({ id: Date.now(), title, date, desc, status: 'pendente' });
                localStorage.setItem('app_tasks', JSON.stringify(app.storage.tasks));
                alert("Tarefa publicada!");
                app.renderTasks();
            },

            renderTasks: () => {
                const list = document.getElementById('task-list');
                list.innerHTML = "";
                app.storage.tasks.forEach(t => {
                    const isDone = t.status === 'done';
                    list.innerHTML += `
                        <div class="task-card ${isDone ? 'done' : ''}">
                            <div class="task-date">Entrega: ${t.date}</div>
                            <h4>${t.title}</h4>
                            <p style="font-size:13px; color:gray">${t.desc}</p>
                            <div style="margin-top:10px">
                                ${app.user.role === 'aluno' ? 
                                `<button class="btn btn-primary" onclick="app.checkTask(${t.id})">${isDone ? 'Concluída' : 'Marcar como Feita'}</button>` : 
                                `<button class="btn btn-ghost" onclick="app.delTask(${t.id})">Excluir</button>`}
                            </div>
                        </div>`;
                });
            },

            checkTask: (id) => {
                const t = app.storage.tasks.find(x => x.id === id);
                t.status = t.status === 'done' ? 'pendente' : 'done';
                localStorage.setItem('app_tasks', JSON.stringify(app.storage.tasks));
                app.renderTasks();
            },

            delTask: (id) => {
                app.storage.tasks = app.storage.tasks.filter(x => x.id !== id);
                localStorage.setItem('app_tasks', JSON.stringify(app.storage.tasks));
                app.renderTasks();
            }
        };
    </script>
</body>
</html>
