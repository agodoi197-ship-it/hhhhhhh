<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Escolar MT - Plataforma Completa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 🎨 DESIGN MODERNO E PROFISSIONAL */
        :root {
            --primary: #1e40af; --primary-light: #3b82f6; --primary-dark: #1e3a8a;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
            --bg: #f8fafc; --card: rgba(255,255,255,0.95); --card-hover: rgba(255,255,255,1);
            --text: #1e293b; --text-muted: #64748b; --text-light: #94a3b8;
            --shadow: 0 10px 25px rgba(0,0,0,0.1); --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            --gradient-success: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* 🖥️ TELAS E TRANSições */
        .screen { display: none; min-height: 100vh; padding: 20px; opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .screen.active { display: block; opacity: 1; transform: translateY(0); }
        
        .header { background: var(--gradient); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .user-info { display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .user-badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 14px; }
        .btn-icon { background: rgba(255,255,255,0.2); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }

        /* 📱 NAVEGAÇÃO INFERIOR FUNCIONAL */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); display: flex; padding: 12px 20px 20px; box-shadow: var(--shadow-lg); z-index: 1000; }
        .nav-item { flex: 1; padding: 12px; border-radius: 20px; border: none; background: transparent; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-muted); }
        .nav-item.active, .nav-item:hover { background: var(--gradient); color: white; transform: translateY(-4px); box-shadow: var(--shadow); }
        .nav-item i { font-size: 24px; transition: all 0.3s; }
        .nav-item.active i { transform: scale(1.1); }

        /* 🎴 CARDS MODERNOS */
        .card { background: var(--card); border-radius: 24px; padding: 28px; margin-bottom: 24px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.2); transition: all 0.3s; backdrop-filter: blur(10px); }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); background: var(--card-hover); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #f1f5f9; }
        .card-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }

        /* 🔘 ABAS SUPERIORES */
        .tabs { display: flex; background: white; border-radius: 16px; padding: 4px; margin-bottom: 24px; box-shadow: var(--shadow); overflow: hidden; }
        .tab { flex: 1; padding: 16px 20px; border: none; background: transparent; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
        .tab.active { background: var(--gradient); color: white; transform: translateY(-2px); }

        /* 📝 FORMULÁRIOS MODERNOS */
        .input-group { margin-bottom: 24px; position: relative; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--text); }
        .input-group input, .input-group select, .input-group textarea { 
            width: 100%; padding: 16px 20px 16px 52px; border: 2px solid #e2e8f0; 
            border-radius: 16px; font-size: 16px; transition: all 0.3s; background: white; 
            font-family: inherit;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { 
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,0.1); 
            transform: translateY(-2px);
        }
        .input-group i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; z-index: 1; }

        /* 🚀 BOTÕES MODERNOS */
        .btn { padding: 14px 24px; border: none; border-radius: 16px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; position: relative; overflow: hidden; }
        .btn-primary { background: var(--gradient); color: white; box-shadow: 0 8px 25px rgba(30,64,175,0.3); min-width: 160px; justify-content: center; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(30,64,175,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-secondary:hover { background: var(--primary); color: white; transform: translateY(-2px); }
        .btn-success { background: var(--gradient-success); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%); color: white; }
        .btn-small { padding: 8px 16px; font-size: 14px; min-width: auto; }
        .btn-floating { position: fixed; bottom: 90px; right: 20px; width: 56px; height: 56px; border-radius: 50%; font-size: 24px; box-shadow: var(--shadow-lg); z-index: 1000; }

        /* 📊 GRID DE TURMAS E TAREFAS */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
        .grid-cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .turma-card, .task-card { background: white; border-radius: 20px; padding: 24px; box-shadow: var(--shadow); transition: all 0.3s; border: 1px solid #f1f5f9; cursor: pointer; position: relative; overflow: hidden; }
        .turma-card:hover:not(.selected), .task-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
        .turma-card.selected { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,0.2), var(--shadow-lg); background: linear-gradient(135deg, rgba(30,64,175,0.05) 0%, white 100%); }
        .turma-card.selected::before { content: ''; position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; }
        .turma-code { background: var(--info); color: white; padding: 8px 16px; border-radius: 12px; font-family: monospace; font-weight: 700; font-size: 18px; text-align: center; margin: 16px 0; }
        .status-badge { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-pending { background: #fef3c7; color: var(--warning); }
        .status-completed { background: #d1fae5; color: var(--success); }
        .status-expired { background: #fee2e2; color: var(--danger); }

        /* 📊 DASHBOARD STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 24px 0; }
        .stat-card { background: white; border-radius: 20px; padding: 24px; text-align: center; box-shadow: var(--shadow); border: 1px solid #f1f5f9; }
        .stat-number { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
        .stat-label { color: var(--text-muted); font-weight: 500; }

        /* 🔔 MODAL DE NOVA TAREFA */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; backdrop-filter: blur(8px); }
        .modal.active { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; border-radius: 24px; padding: 32px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .modal-close:hover { background: #f1f5f9; color: var(--danger); }

        /* 📱 MOBILE FIRST */
        @media (max-width: 768px) { 
            .screen { padding: 16px; } 
            .header-content { padding: 0 10px; flex-wrap: wrap; gap: 10px; }
            .grid { grid-template-columns: 1fr; gap: 16px; }
            .card { padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .btn-floating { bottom: 100px; right: 16px; }
        }

        /* 🔔 TOAST E LOADING */
        .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); padding: 16px 24px; border-radius: 16px; font-weight: 600; display: none; z-index: 2000; box-shadow: var(--shadow-lg); max-width: 90vw; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .loading-spinner { text-align: center; color: white; }
        .loading-spinner i { font-size: 64px; margin-bottom: 20px; opacity: 0.8; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 📊 ESTADO VAZIO */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.4; display: block; }
        .access-denied { text-align: center; padding: 60px 20px; color: var(--danger); }
    </style>
</head>
<body>
    <!-- 🔄 LOADING -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner">
            <i class="fas fa-graduation-cap"></i>
            <p>Carregando plataforma...</p>
        </div>
    </div>

    <!-- 📱 HEADER -->
    <header class="header" id="header" style="display: none;">
        <div class="header-content">
            <div class="user-info">
                <i class="fas fa-user-circle" style="font-size: 32px;"></i>
                <span id="userName"></span>
                <span id="userRole" class="user-badge"></span>
            </div>
            <button class="btn-icon" onclick="App.logout()" title="Sair">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main>
        <!-- 🚪 LOGIN -->
        <section id="loginScreen" class="screen active">
            <div class="card" style="max-width: 420px; margin: 0 auto;">
                <div style="text-align: center; margin-bottom: 32px;">
                    <i class="fas fa-graduation-cap" style="font-size: 56px; color: var(--primary); margin-bottom: 16px; display: block;"></i>
                    <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 8px;">Alerta Escolar MT</h1>
                    <p style="color: var(--text-muted);">Plataforma oficial de comunicação escolar</p>
                </div>
                <form id="loginForm">
                    <div class="input-group">
                        <label>E-mail escolar</label>
                        <input type="email" id="loginEmail" placeholder="aluno@edu.mt.gov.br" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
                <div style="text-align: center; margin-top: 24px;">
                    <p style="color: var(--text-muted);">Não tem conta? <a href="#" onclick="App.showScreen('registerScreen'); return false;" style="color: var(--primary); font-weight: 600; text-decoration: none;">Cadastre-se</a></p>
                </div>
            </div>
        </section>

        <!-- ➕ REGISTRO -->
        <section id="registerScreen" class="screen">
            <div class="card" style="max-width: 420px; margin: 0 auto;">
                <div style="text-align: center; margin-bottom: 32px;">
                    <i class="fas fa-user-plus" style="font-size: 56px; color: var(--success); margin-bottom: 16px; display: block;"></i>
                    <h1 style="font-size: 28px; font-weight: 700;">Criar Conta</h1>
                </div>
                <form id="registerForm">
                    <div class="input-group">
                        <label>Nome completo</label>
                        <input type="text" id="regName" placeholder="João Silva" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="input-group">
                        <label>E-mail escolar</label>
                        <input type="email" id="regEmail" placeholder="joao@edu.mt.gov.br" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="input-group">
                        <label>Senha</label>
                        <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="input-group">
                        <label>Tipo de usuário</label>
                        <div style="display: flex; gap: 12px; margin-top: 12px;">
                            <label style="flex: 1; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s; font-weight: 500;">
                                <input type="radio" name="userType" value="aluno" checked style="width: 20px; height: 20px; accent-color: var(--primary);">
                                <i class="fas fa-user-graduate"></i> Aluno
                            </label>
                            <label style="flex: 1; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s; font-weight: 500;">
                                <input type="radio" name="userType" value="professor" style="width: 20px; height: 20px; accent-color: var(--primary);">
                                <i class="fas fa-chalkboard-teacher"></i> Professor
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-check"></i> Criar Conta
                    </button>
                </form>
                <button class="btn btn-secondary" onclick="App.showScreen('loginScreen')" style="width: 100%; margin-top: 16px;">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </section>

        <!-- 🎓 DASHBOARD GERAL -->
        <section id="dashboardScreen" class="screen">
            <div class="card-header">
                <div class="card-title">
                    <i class="fas fa-home"></i> Dashboard Geral
                </div>
                <div id="taskCounter" style="font-weight: 600; color: var(--warning);"></div>
            </div>
            
            <div class="stats-grid" id="dashboardStats"></div>
            
            <div class="card">
                <h3 style="margin-bottom: 20px; font-weight: 600;"><i class="fas fa-rocket"></i> Ações Rápidas</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                    <button class="btn btn-primary" onclick="App.handleQuickAction('classes')">
                        <i class="fas fa-users"></i> Minhas Turmas
                    </button>
                    <button class="btn btn-success" onclick="App.handleQuickAction('tasks')">
                        <i class="fas fa-tasks"></i> Tarefas
                    </button>
                </div>
            </div>
        </section>

        <!-- 👨‍🏫 DASHBOARD PROFESSOR -->
        <section id="profDash" class="screen">
            <div class="card-header">
                <div class="card-title">
                    <i class="fas fa-chalkboard-teacher"></i> Professor
                </div>
                <button class="btn btn-secondary btn-small" onclick="App.showBottomNav('dash')">
                    <i class="fas fa-home"></i> Dashboard
                </button>
            </div>
            
            <div class="tabs" id="profTabs">
                <button class="tab active" data-tab="classes">
                    <i class="fas fa-users"></i> Minhas Turmas
                </button>
                <button class="tab" data-tab="create-class">
                    <i class="fas fa-plus"></i> Nova Turma
                </button>
                <button class="tab" data-tab="tasks">
                    <i class="fas fa-tasks"></i> Gerenciar Tarefas
                </button>
            </div>
            
            <div id="profContent" class="card"></div>
        </section>

        <!-- 🎓 DASHBOARD ALUNO -->
        <section id="studentDash" class="screen">
            <div class="card-header">
                <div class="card-title">
                    <i class="fas fa-user-graduate"></i> Aluno
                </div>
                <button class="btn btn-secondary btn-small" onclick="App.showBottomNav('dash')">
                    <i class="fas fa-home"></i> Dashboard
                </button>
            </div>
            
            <div class="tabs" id="studentTabs">
                <button class="tab active" data-tab="classes">
                    <i class="fas fa-users"></i> Minhas Turmas
                </button>
                <button class="tab" data-tab="tasks">
                    <i class="fas fa-tasks"></i> Tarefas
                </button>
                <button class="tab" data-tab="join">
                    <i class="fas fa-plus"></i> Entrar em Turma
                </button>
            </div>
            
            <div id="studentContent" class="card"></div>
        </section>

        <!-- 👤 PERFIL -->
        <section id="profileScreen" class="screen">
            <div class="card-header">
                <div class="card-title">
                    <i class="fas fa-user-circle"></i> Meu Perfil
                </div>
                <button class="btn btn-secondary btn-small" onclick="App.showBottomNav('dash')">
                    <i class="fas fa-home"></i> Início
                </button>
            </div>
            
            <div id="profileContent" class="card"></div>
        </section>
    </main>

    <!-- 📱 NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav" id="bottomNav" style="display: none;">
        <button class="nav-item active" data-nav="dash" title="Início">
            <i class="fas fa-home"></i><span>Início</span>
        </button>
        <button class="nav-item" data-nav="tasks" title="Tarefas">
            <i class="fas fa-tasks"></i><span>Tarefas</span>
        </button>
        <button class="nav-item" data-nav="profile" title="Perfil">
            <i class="fas fa-user-circle"></i><span>Perfil</span>
        </button>
    </nav>

    <!-- ➕ BOTÃO FLUTUANTE NOVA TAREFA (SÓ PROFESSOR) -->
    <button id="newTaskBtn" class="btn btn-primary btn-floating" style="display: none;" title="Nova Tarefa">
        <i class="fas fa-plus"></i>
    </button>

    <!-- 🔔 MODAL NOVA TAREFA -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-weight: 700;"><i class="fas fa-plus"></i> Nova Tarefa</h2>
                <button class="modal-close" onclick="App.closeTaskModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="newTaskForm">
                <div class="input-group">
                    <label>Título da Tarefa *</label>
                    <input type="text" id="taskTitle" placeholder="Ex: Exercícios de Matemática" required>
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div class="input-group">
                    <label>Descrição *</label>
                    <textarea id="taskDescription" placeholder="Descreva detalhadamente a tarefa..." rows="5" required></textarea>
                    <i class="fas fa-align-left"></i>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">
                        <i class="fas fa-check"></i> Criar Tarefa
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="App.closeTaskModal()" style="flex: 1;">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 🔔 TOAST -->
    <div id="toast" class="toast"></div>

    <!-- 🔥 FIREBASE - SISTEMA DE TAREFAS COMPLETO -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getFirestore, collection, addDoc, getDocs, getDoc, query, where, orderBy, limit,
            doc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, arrayUnion, arrayRemove,
            writeBatch
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // 🔥 CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBSkZ_2RIsZBxhf8JkYCaDSsGRA7U1HCfY",
            authDomain: "projeto-escola-b6ffd.firebaseapp.com",
            projectId: "projeto-escola-b6ffd",
            storageBucket: "projeto-escola-b6ffd.appspot.com",
            messagingSenderId: "62998039657",
            appId: "1:62998039657:web:234d97ff81f01ec59066f8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 🎯 APP PRINCIPAL - SISTEMA DE TAREFAS COMPLETO ✅
        window.App = {
            user: null,
            userType: null,
            unsubscribeListeners: [],
            currentScreen: 'loginScreen',
            activeNav: 'dash',
            currentTab: 'classes',
            turmaSelecionada: null, // 🔑 VARIÁVEL GLOBAL TURMA SELECIONADA

            // 🚀 INICIALIZAÇÃO
            async init() {
                console.log('🚀 Inicializando Alerta Escolar MT com Sistema de Tarefas...');
                this.hideLoading();
                this.attachGlobalEvents();
                
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        this.user = { uid: user.uid, email: user.email };
                        await this.loadUserProfile();
                    } else {
                        this.resetApp();
                        this.showScreen('loginScreen');
                    }
                });
            },

            // 👤 CARREGAR PERFIL
            async loadUserProfile() {
                try {
                    const userDoc = await getDoc(doc(db, 'users', this.user.uid));
                    if (userDoc.exists()) {
                        this.user = { ...this.user, ...userDoc.data() };
                        this.userType = this.user.tipo;
                        
                        document.getElementById('userName').textContent = this.user.nome;
                        document.getElementById('userRole').textContent = this.user.tipo === 'professor' ? 'Professor' : 'Aluno';
                        
                        this.showBottomNav('dash');
                        await this.renderDashboardStats();
                    }
                } catch (error) {
                    console.error('Erro ao carregar perfil:', error);
                    this.showToast('Erro ao carregar perfil', 'danger');
                }
            },

            // 📱 MOSTRAR TELA
            showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                this.currentScreen = screenId;
                
                const showHeaderNav = !['loginScreen', 'registerScreen'].includes(screenId);
                document.getElementById('header').style.display = showHeaderNav ? 'block' : 'none';
                document.getElementById('bottomNav').style.display = showHeaderNav ? 'flex' : 'none';
            },

            // 🧭 NAVEGAÇÃO INFERIOR
            showBottomNav(navTarget) {
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                const navItem = document.querySelector(`[data-nav="${navTarget}"]`);
                if (navItem) navItem.classList.add('active');
                
                this.activeNav = navTarget;
                this.handleNavClick(navTarget);
            },

            // 🔄 NAVEGAÇÃO
            handleNavClick(navTarget) {
                switch(navTarget) {
                    case 'dash':
                        this.showScreen('dashboardScreen');
                        this.renderDashboardStats();
                        break;
                    case 'tasks':
                        if (this.userType === 'aluno') {
                            this.showScreen('studentDash');
                            this.renderStudentTab('tasks');
                        } else {
                            this.showScreen('profDash');
                            this.renderProfessorTab('tasks');
                        }
                        break;
                    case 'profile':
                        this.showScreen('profileScreen');
                        this.renderProfile();
                        break;
                }
            },

            // ⚡ AÇÕES RÁPIDAS
            handleQuickAction(action) {
                if (action === 'classes') {
                    if (this.userType === 'aluno') {
                        this.showScreen('studentDash');
                        this.renderStudentTab('classes');
                    } else {
                        this.showScreen('profDash');
                        this.renderProfessorTab('classes');
                    }
                } else if (action === 'tasks') {
                    this.showBottomNav('tasks');
                }
            },

            // 👨‍🏫 DASHBOARD PROFESSOR - TAREFAS ✅
            async renderProfessorTab(tab) {
                const content = document.getElementById('profContent');
                this.currentTab = tab;

                if (tab === 'classes') {
                    await this.loadProfessorClasses();
                } else if (tab === 'create-class') {
                    content.innerHTML = this.getCreateClassForm();
                } else if (tab === 'tasks') {
                    // ✅ NOVA TELA DE TAREFAS PROFESSOR
                    content.innerHTML = `
                        <div class="card-header">
                            <div class="card-title">
                                <i class="fas fa-tasks"></i> Gerenciar Tarefas
                            </div>
                            ${this.turmaSelecionada ? `
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <span class="status-badge" style="background: var(--primary); color: white;">
                                        Turma: ${this.turmaSelecionada.nome || 'N/A'}
                                    </span>
                                    <button class="btn btn-secondary btn-small" onclick="App.clearTurmaSelecionada()">
                                        <i class="fas fa-times"></i> Limpar
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        ${this.turmaSelecionada ? `
                            <div class="card">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                                    <h3 style="font-weight: 600;"><i class="fas fa-list"></i> Tarefas da Turma</h3>
                                    <button id="openTaskModal" class="btn btn-success">
                                        <i class="fas fa-plus"></i> Nova Tarefa
                                    </button>
                                </div>
                                <div id="tasksList" class="grid"></div>
                            </div>
                        ` : `
                            <div class="empty-state">
                                <i class="fas fa-tasks"></i>
                                <h3>Selecione uma turma</h3>
                                <p>Clique em uma das suas turmas para criar e gerenciar tarefas.</p>
                                <button class="btn btn-primary" onclick="App.renderProfessorTab('classes')">
                                    <i class="fas fa-users"></i> Ver Minhas Turmas
                                </button>
                            </div>
                        `}
                    `;
                    
                    // ✅ MOSTRAR BOTÃO FLUTUANTE
                    if (this.turmaSelecionada) {
                        document.getElementById('newTaskBtn').style.display = 'flex';
                        document.getElementById('openTaskModal').onclick = () => this.openTaskModal();
                        await this.loadProfessorTasks();
                    } else {
                        document.getElementById('newTaskBtn').style.display = 'none';
                    }
                }
            },

            // 🎓 DASHBOARD ALUNO - TAREFAS ✅
            async renderStudentTab(tab) {
                const content = document.getElementById('studentContent');
                this.currentTab = tab;
                
                if (tab === 'classes') {
                    await this.loadStudentClasses();
                } else if (tab === 'tasks') {
                    await this.loadStudentTasks();
                } else if (tab === 'join') {
                    content.innerHTML = this.getJoinClassForm();
                }
            },

            // 🔧 CARREGAMENTO TURMAS PROFESSOR - COM SELEÇÃO ✅
            async loadProfessorClasses() {
                const content = document.getElementById('profContent');
                content.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Carregando...</p></div>';
                
                try {
                    this.unsubscribeListeners.forEach(unsub => unsub());
                    this.unsubscribeListeners = [];

                    const q = query(
                        collection(db, 'turmas'), 
                        where('professorId', '==', this.user.uid),
                        limit(50)
                    );

                    const unsubscribe = onSnapshot(q, (snapshot) => {
                        if (snapshot.empty) {
                            content.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-users"></i>
                                    <h3>Nenhuma turma criada</h3>
                                    <p>Crie sua primeira turma!</p>
                                    <button class="btn btn-primary" onclick="App.renderProfessorTab('create-class')">
                                        <i class="fas fa-plus"></i> Criar Primeira Turma
                                    </button>
                                </div>
                            `;
                            return;
                        }
                        
                        let html = '<div class="grid">';
                        snapshot.docs.forEach(doc => {
                            const turma = { id: doc.id, ...doc.data() };
                            const isSelected = this.turmaSelecionada?.id === turma.id;
                            html += this.renderClassCard(turma, true, isSelected);
                        });
                        html += '</div>';
                        content.innerHTML = html;
                    });
                    
                    this.unsubscribeListeners.push(unsubscribe);
                } catch (error) {
                    console.error('Erro:', error);
                    content.innerHTML = '<div class="access-denied"><i class="fas fa-exclamation-triangle"></i><h3>Erro ao carregar</h3></div>';
                }
            },

            // 🎯 SELECIONAR TURMA (NOVO!) ✅
            selectTurma(turmaId, turmaNome) {
                this.turmaSelecionada = { id: turmaId, nome: turmaNome };
                console.log('✅ Turma selecionada:', this.turmaSelecionada);
                
                // Atualizar visualmente
                document.querySelectorAll('.turma-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.querySelector(`[onclick="App.selectTurma('${turmaId}', '${turmaNome}')"]`)?.closest('.turma-card').classList.add('selected');
                
                this.showToast(`✅ Turma "${turmaNome}" selecionada!`, 'success');
                
                // Recarregar tela de tarefas
                if (this.currentTab === 'tasks') {
                    this.renderProfessorTab('tasks');
                }
            },

            // 🗑️ LIMPAR TURMA SELECIONADA
            clearTurmaSelecionada() {
                this.turmaSelecionada = null;
                document.getElementById('newTaskBtn').style.display = 'none';
                document.querySelectorAll('.turma-card').forEach(card => card.classList.remove('selected'));
                this.renderProfessorTab('tasks');
                this.showToast('🧹 Seleção limpa', 'info');
            },

            // 📋 CARREGAR TAREFAS PROFESSOR (NOVO!) ✅
            async loadProfessorTasks() {
                if (!this.turmaSelecionada) return;
                
                const tasksList = document.getElementById('tasksList');
                tasksList.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Carregando tarefas...</p></div>';

                try {
                    this.unsubscribeListeners.forEach(unsub => unsub());
                    this.unsubscribeListeners = [];

                    const q = query(
                        collection(db, 'tarefas'),
                        where('turmaId', '==', this.turmaSelecionada.id),
                        where('professorId', '==', this.user.uid),
                        orderBy('createdAt', 'desc'),
                        limit(50)
                    );

                    const unsubscribe = onSnapshot(q, (snapshot) => {
                        if (snapshot.empty) {
                            tasksList.innerHTML = `
                                <div class="empty-state">
                                    <i class="fas fa-clipboard-list"></i>
                                    <h3>Nenhuma tarefa criada</h3>
                                    <p>Crie a primeira tarefa desta turma!</p>
                                </div>
                            `;
                            return;
                        }

                        let html = '<div class="grid">';
                        snapshot.docs.forEach(doc => {
                            const tarefa = { id: doc.id, ...doc.data() };
                            html += this.renderTaskCard(tarefa, true);
                        });
                        html += '</div>';
                        tasksList.innerHTML = html;
                    });

                    this.unsubscribeListeners.push(unsubscribe);
                } catch (error) {
                    console.error('Erro ao carregar tarefas:', error);
                    tasksList.innerHTML = '<div class="access-denied"><h3>Erro ao carregar tarefas</h3></div>';
                }
            },

            // 📝 CARREGAR TAREFAS ALUNO (MELHORADO!) ✅
            async loadStudentTasks() {
                const content = document.getElementById('studentContent');
                content.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Carregando...</p></div>';

                try {
                    const studentClassesQuery = query(collection(db, 'studentClasses'), where('aluno', '==', this.user.uid));
                    const studentClassesSnapshot = await getDocs(studentClassesQuery);
                    
                    if (studentClassesSnapshot.empty) {
                        content.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-users-slash"></i>
                                <h3>Nenhuma turma</h3>
                                <p>Entre em uma turma para ver tarefas.</p>
                                <button class="btn btn-primary" onclick="App.renderStudentTab('join')">
                                    <i class="fas fa-plus"></i> Entrar em Turma
                                </button>
                            </div>
                        `;
                        return;
                    }

                    let allTasks = [];
                    for (const doc of studentClassesSnapshot.docs) {
                        const studentClass = doc.data();
                        const turmaDoc = await getDoc(doc(db, 'turmas', studentClass.classId));
                        if (turmaDoc.exists()) {
                            const tasksQuery = query(
                                collection(db, 'tarefas'),
                                where('turmaId', '==', studentClass.classId),
                                orderBy('createdAt', 'desc')
                            );
                            const tasksSnapshot = await getDocs(tasksQuery);
                            tasksSnapshot.docs.forEach(taskDoc => {
                                allTasks.push({ id: taskDoc.id, ...taskDoc.data(), turmaNome: turmaDoc.data().nome });
                            });
                        }
                    }

                    if (allTasks.length === 0) {
                        content.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-tasks"></i>
                                <h3>Sem tarefas pendentes</h3>
                                <p>Nenhuma tarefa atribuída nas suas turmas.</p>
                            </div>
                        `;
                    } else {
                        let html = `
                            <div class="card-header">
                                <div class="card-title"><i class="fas fa-tasks"></i> Suas Tarefas</div>
                            </div>
                            <div class="grid">
                        `;
                        allTasks.forEach(tarefa => {
                            html += this.renderTaskCard(tarefa, false);
                        });
                        html += '</div>';
                        content.innerHTML = html;
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    content.innerHTML = '<div class="access-denied"><h3>Erro ao carregar tarefas</h3></div>';
                }
            },

            // ➕ MODAL NOVA TAREFA (NOVO!) ✅
            openTaskModal() {
                if (!this.turmaSelecionada) {
                    this.showToast('❌ Selecione uma turma primeiro!', 'danger');
                    return;
                }
                document.getElementById('taskModal').classList.add('active');
                document.getElementById('taskTitle').focus();
            },

            closeTaskModal() {
                document.getElementById('taskModal').classList.remove('active');
                document.getElementById('newTaskForm').reset();
            },

            // 💾 CRIAR TAREFA (NOVO!) ✅
            async createTask() {
                if (!this.turmaSelecionada) {
                    this.showToast('❌ Nenhuma turma selecionada!', 'danger');
                    return;
                }

                try {
                    const titulo = document.getElementById('taskTitle').value.trim();
                    const descricao = document.getElementById('taskDescription').value.trim();

                    if (!titulo || !descricao) {
                        return this.showToast('❌ Preencha todos os campos!', 'danger');
                    }

                    this.showLoading();

                    await addDoc(collection(db, 'tarefas'), {
                        titulo,
                        descricao,
                        turmaId: this.turmaSelecionada.id,
                        professorId: this.user.uid,
                        professorNome: this.user.nome,
                        createdAt: serverTimestamp()
                    });

                    this.showToast(`✅ Tarefa "${titulo}" criada com sucesso!`, 'success');
                    this.closeTaskModal();
                    await this.loadProfessorTasks();

                } catch (error) {
                    console.error('Erro ao criar tarefa:', error);
                    this.showToast('❌ Erro ao criar tarefa: ' + error.message, 'danger');
                } finally {
                    this.hideLoading();
                }
            },

            // 🎴 CARD DE TURMA - COM SELEÇÃO ✅
            renderClassCard(turma, isProfessor, isSelected = false) {
                const alunoCount = turma.alunos?.length || 0;
                const code = turma.codigo || '---';
                return `
                    <div class="turma-card ${isSelected ? 'selected' : ''}" 
                         onclick="${isProfessor ? `App.selectTurma('${turma.id}', '${turma.nome.replace(/'/g, "\\'")}')` : ''}" 
                         style="cursor: ${isProfessor ? 'pointer' : 'default'};">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px;">
                            <div>
                                <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">${turma.nome}</h3>
                                <p style="color: var(--text-muted); font-size: 14px;">${turma.descricao || 'Sem descrição'}</p>
                            </div>
                            <div class="status-badge">${alunoCount} aluno${alunoCount !== 1 ? 's' : ''}</div>
                        </div>
                        <div class="turma-code">${code}</div>
                        ${isProfessor ? `
                            <div style="display: flex; gap: 8px; margin-top: 16px;">
                                <button class="btn btn-primary btn-small" onclick="event.stopPropagation(); App.selectTurma('${turma.id}', '${turma.nome.replace(/'/g, "\\'")}')" title="Gerenciar Tarefas">
                                    <i class="fas fa-tasks"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            // 📋 CARD DE TAREFA (NOVO!) ✅
            renderTaskCard(tarefa, isProfessor) {
                const createdAt = tarefa.createdAt?.toDate ? 
                    tarefa.createdAt.toDate().toLocaleDateString('pt-BR') : 'Hoje';
                
                return `
                    <div class="task-card">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 4px; color: var(--text);">${tarefa.titulo}</h3>
                            <span class="status-badge status-pending">Pendente</span>
                        </div>
                        <p style="color: var(--text-muted); margin-bottom: 16px; line-height: 1.5;">${tarefa.descricao}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-light);">
                            <span><i class="fas fa-calendar"></i> ${createdAt}</span>
                            ${tarefa.turmaNome ? `<span><i class="fas fa-users"></i> ${tarefa.turmaNome}</span>` : ''}
                        </div>
                        ${isProfessor ? `
                            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #f1f5f9;">
                                <button class="btn btn-danger btn-small" onclick="App.deleteTask('${tarefa.id}')" style="width: 100%;">
                                    <i class="fas fa-trash"></i> Excluir Tarefa
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

            // 🗑️ DELETAR TAREFA (NOVO!) ✅
            async deleteTask(taskId) {
                if (!confirm('Tem certeza que deseja excluir esta tarefa?')) return;

                try {
                    this.showLoading();
                    await deleteDoc(doc(db, 'tarefas', taskId));
                    this.showToast('✅ Tarefa excluída!', 'success');
                } catch (error) {
                    console.error('Erro:', error);
                    this.showToast('❌ Erro ao excluir tarefa', 'danger');
                } finally {
                    this.hideLoading();
                }
            },

            // 📊 DASHBOARD STATS - COM TAREFAS ✅
            async renderDashboardStats() {
                try {
                    const statsGrid = document.getElementById('dashboardStats');
                    let turmasCount = 0, tarefasCount = 0;

                    if (this.userType === 'professor') {
                        const turmasQuery = query(collection(db, 'turmas'), where('professorId', '==', this.user.uid));
                        const turmasSnapshot = await getDocs(turmasQuery);
                        turmasCount = turmasSnapshot.size;

                        let totalTarefas = 0;
                        for (const doc of turmasSnapshot.docs) {
                            const turmaId = doc.id;
                            const tarefasQuery = query(collection(db, 'tarefas'), where('turmaId', '==', turmaId));
                            const tarefasSnapshot = await getDocs(tarefasQuery);
                            totalTarefas += tarefasSnapshot.size;
                        }
                        tarefasCount = totalTarefas;
                    }

                    statsGrid.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number" style="color: var(--primary);">${turmasCount}</div>
                            <div class="stat-label">Turmas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" style="color: var(--success);">${tarefasCount}</div>
                            <div class="stat-label">Tarefas Criadas</div>
                        </div>
                    `;
                } catch (error) {
                    console.error('Erro stats:', error);
                }
            },

            // 🔌 EVENTOS GLOBAIS - COMPLETOS ✅
            attachGlobalEvents() {
                // LOGIN
                document.getElementById('loginForm')?.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('loginEmail').value;
                    const password = document.getElementById('loginPassword').value;
                    this.login(email, password);
                });

                // REGISTRO
                document.getElementById('registerForm')?.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.register();
                });

                // NAVEGAÇÃO
                document.getElementById('bottomNav')?.addEventListener('click', (e) => {
                    const navItem = e.target.closest('.nav-item');
                    if (!navItem) return;
                    this.showBottomNav(navItem.dataset.nav);
                });

                // ABAS
                document.addEventListener('click', async (e) => {
                    const tab = e.target.closest('.tab');
                    if (!tab) return;
                    
                    const tabsContainer = tab.closest('.tabs');
                    tabsContainer.querySelector('.tab.active')?.classList.remove('active');
                    tab.classList.add('active');
                    
                    this.currentTab = tab.dataset.tab;
                    
                    if (document.getElementById('studentDash').classList.contains('active')) {
                        await this.renderStudentTab(this.currentTab);
                    } else if (document.getElementById('profDash').classList.contains('active')) {
                        await this.renderProfessorTab(this.currentTab);
                    }
                });

                // FORM TAREFAS ✅
                document.addEventListener('submit', (e) => {
                    if (e.target.id === 'newTaskForm') {
                        e.preventDefault();
                        this.createTask();
                    } else if (e.target.id === 'createClassForm') {
                        e.preventDefault();
                        this.createClass();
                    } else if (e.target.id === 'joinClassForm') {
                        e.preventDefault();
                        this.joinClass();
                    }
                });

                // BOTÃO FLUTUANTE
                document.getElementById('newTaskBtn')?.addEventListener('click', () => this.openTaskModal());

                // FECHAR MODAL EXTERNO
                document.getElementById('taskModal')?.addEventListener('click', (e) => {
                    if (e.target.classList.contains('modal')) {
                        this.closeTaskModal();
                    }
                });
            },

            // 🔑 FORM ENTRAR TURMA
            getJoinClassForm() {
                return `
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-key"></i> Entrar na Turma</div>

            // AUTH FUNCTIONS (mantidas iguais)
            async login(email, password) {
                try {
                    this.showLoading();
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    this.showToast(this.getErrorMessage(error.code), 'danger');
                } finally {
                    this.hideLoading();
                }
            },

            async register() {
                const nome = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const tipo = document.querySelector('input[name="userType"]:checked').value;

                if (!nome || !email || !password || password.length < 6) {
                    return this.showToast('Preencha todos os campos corretamente', 'danger');
                }

                try {
                    this.showLoading();
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, 'users', userCredential.user.uid), {
                        uid: userCredential.user.uid,
                        nome, email, tipo,
                        createdAt: serverTimestamp()
                    });
                    this.showToast('✅ Conta criada! Faça login.', 'success');
                    this.showScreen('loginScreen');
                } catch (error) {
                    this.showToast(this.getErrorMessage(error.code), 'danger');
                } finally {
                    this.hideLoading();
                }
            },

            logout() {
                if (confirm('Deseja sair?')) {
                    this.unsubscribeListeners.forEach(unsub => unsub());
                    this.unsubscribeListeners = [];
                    signOut(auth);
                }
            },

            getErrorMessage(code) {
                const messages = {
                    'auth/user-not-found': 'Usuário não encontrado',
                    'auth/wrong-password': 'Senha incorreta',
                    'auth/invalid-email': 'E-mail inválido',
                    'auth/email-already-in-use': 'E-mail já cadastrado',
                    'auth/weak-password': 'Senha muito fraca'
                };
                return messages[code] || 'Erro desconhecido';
            },

            // UTILS
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.style.background = type === 'success' ? 'var(--success)' : 
                                        type === 'warning' ? 'var(--warning)' : 'var(--danger)';
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 4000);
            },

            showLoading() { document.getElementById('loading').style.display = 'flex'; },
            hideLoading() { document.getElementById('loading').style.display = 'none'; },

            resetApp() {
                this.user = null;
                this.userType = null;
                this.turmaSelecionada = null;
                this.unsubscribeListeners.forEach(unsub => unsub());
                this.unsubscribeListeners = [];
            },

            // FUNÇÕES ANTIGAS (mantidas)
            async createClass() {
                // [Código existente mantido]
                const nome = document.getElementById('className').value.trim();
                const descricao = document.getElementById('classDesc').value.trim();
                const codigo = document.getElementById('classCode').value.trim();
                
                try {
                    this.showLoading();
                    const turmaRef = await addDoc(collection(db, 'turmas'), {
                        nome, descricao: descricao || '', codigo,
                        professorId: this.user.uid,
                        professorNome: this.user.nome,
                        alunos: [], createdAt: serverTimestamp()
                    });
                    this.showToast(`✅ Turma "${nome}" criada!`, 'success');
                    setTimeout(() => this.renderProfessorTab('classes'), 1500);
                } catch (error) {
                    this.showToast('Erro ao criar turma', 'danger');
                } finally {
                    this.hideLoading();
                }
            },

            async joinClass() {
                // [Código existente mantido - simplificado]
                const codigo = document.getElementById('joinCode').value.trim().toUpperCase();
                try {
                    this.showLoading();
                    const q = query(collection(db, 'turmas'), where('codigo', '==', codigo));
                    const snapshot = await getDocs(q);
                    if (snapshot.empty) return this.showToast('Código inválido', 'danger');
                    
                    const turma = snapshot.docs[0];
                    await updateDoc(doc(db, 'turmas', turma.id), {
                        alunos: arrayUnion({ id: this.user.uid, nome: this.user.nome, email: this.user.email })
                    });
                    this.showToast('✅ Turma entrada com sucesso!', 'success');
                    setTimeout(() => this.renderStudentTab('classes'), 1500);
                } catch (error) {
                    this.showToast('Erro: ' + error.message, 'danger');
                } finally {
                    this.hideLoading();
                }
            },

            renderProfile() {
                // [Código perfil mantido]
                document.getElementById('profileContent').innerHTML = `
                    <div style="text-align: center;">
                        <i class="fas fa-user-circle" style="font-size: 80px; color: var(--primary);"></i>
                        <h2>${this.user.nome}</h2>
                        <p>${this.user.email}</p>
                        <span class="user-badge" style="background: var(--${this.userType === 'professor' ? 'primary' : 'success'});">
                            ${this.userType === 'professor' ? '👨‍🏫 Professor' : '🎓 Aluno'}
                        </span>
                    </div>
                    <button class="btn btn-danger" onclick="App.logout()" style="width: 100%;">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                `;
            }
        };

        // 🎬 INICIAR
        window.addEventListener('load', () => App.init());
    </script>
</body>
</html>
